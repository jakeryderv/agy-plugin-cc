name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          for f in $(find plugins tests -name '*.mjs') tests/fake-agy; do
            node --check "$f"
          done
      - name: Tests
        run: node --test tests/*.test.mjs
